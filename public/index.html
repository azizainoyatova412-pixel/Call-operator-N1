<!DOCTYPE html>
<html lang="uz" translate="no">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <title>AI Ovozli Operator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- Vapi Official Web SDK -->
  <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Vapi qo'shimcha floating tugmasini yashirish — faqat bitta asosiy tugma qoladi */
    .vapi-btn,
    [class*="vapi-btn"],
    iframe[title*="vapi"] {
      display: none !important;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .title-box {
      margin-bottom: 40px;
    }

    .title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    .title span {
      background: linear-gradient(135deg, #a5b4fc, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 15px;
      color: #94a3b8;
      font-weight: 400;
      line-height: 1.5;
    }

    /* Asosiy yagona gaplashish tugmasi */
    .mic-container {
      position: relative;
      margin: 20px 0 30px;
    }

    .main-call-btn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      font-family: inherit;
      position: relative;
      z-index: 2;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 40px -10px rgba(99, 102, 241, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .main-call-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 15px 50px -10px rgba(99, 102, 241, 0.7);
    }

    .main-call-btn:active {
      transform: scale(0.96);
    }

    .main-call-btn.active {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
      box-shadow: 0 10px 40px -10px rgba(239, 68, 68, 0.6) !important;
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6), 0 10px 40px -10px rgba(239, 68, 68, 0.6);
      }
      70% {
        box-shadow: 0 0 0 24px rgba(239, 68, 68, 0), 0 10px 40px -10px rgba(239, 68, 68, 0.6);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0), 0 10px 40px -10px rgba(239, 68, 68, 0.6);
      }
    }

    .btn-icon {
      font-size: 42px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .btn-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* Holat paneli */
    .status-text {
      font-size: 15px;
      font-weight: 600;
      color: #cbd5e1;
      min-height: 24px;
      margin-bottom: 8px;
      transition: color 0.2s;
    }

    .status-text.active {
      color: #34d399;
    }

    .status-text.speaking {
      color: #60a5fa;
    }

    .status-text.error {
      color: #f87171;
    }

    .timer-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #a5b4fc;
      margin-bottom: 20px;
    }

    /* Transkript qutisi */
    .transcript-box {
      display: none;
      width: 100%;
      max-height: 240px;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 16px;
      margin-top: 10px;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
    }

    .transcript-box.visible {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 90%;
      word-wrap: break-word;
    }

    .msg-user {
      align-self: flex-end;
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #e0e7ff;
    }

    .msg-ai {
      align-self: flex-start;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #d1fae5;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="title-box">
      <h1 class="title">AI <span>Operator</span></h1>
      <p class="subtitle">Ovozli yordamchi bilan jonli muloqot qiling</p>
    </div>

    <!-- Asosiy bitta gaplashish tugmasi -->
    <div class="mic-container">
      <button id="call-btn" class="main-call-btn" type="button">
        <span class="btn-icon" id="call-icon">🎙️</span>
        <span class="btn-label" id="call-text">Boshlash</span>
      </button>
    </div>

    <!-- Holat va vaqt -->
    <div id="status-text" class="status-text">Tugmani bosing va mikrofonga ruxsat bering</div>
    <div id="timer-badge" class="timer-badge">⏱️ <span id="timer-val">00:00</span></div>

    <!-- Jonli transkript -->
    <div id="transcript-box" class="transcript-box"></div>
  </div>

  <script type="module">
    const PUBLIC_KEY = '2d396194-3f23-4744-b177-3725213479a8';
    const ASSISTANT_ID = '943f252e-d9d2-462f-85a3-127138be365f';

    let vapi = null;
    let callActive = false;
    let callSeconds = 0;
    let timerInterval = null;

    const callBtn = document.getElementById('call-btn');
    const callIcon = document.getElementById('call-icon');
    const callText = document.getElementById('call-text');
    const statusText = document.getElementById('status-text');
    const timerBadge = document.getElementById('timer-badge');
    const timerVal = document.getElementById('timer-val');
    const transcriptBox = document.getElementById('transcript-box');

    // Timer
    function startTimer() {
      callSeconds = 0;
      timerBadge.style.display = 'inline-flex';
      timerVal.textContent = '00:00';
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        callSeconds++;
        const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const s = String(callSeconds % 60).padStart(2, '0');
        timerVal.textContent = `${m}:${s}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerBadge.style.display = 'none';
    }

    function setStatus(msg, cls) {
      statusText.textContent = msg;
      statusText.className = 'status-text' + (cls ? ' ' + cls : '');
    }

    function appendTranscript(role, text) {
      transcriptBox.classList.add('visible');
      const div = document.createElement('div');
      div.className = 'msg-bubble ' + (role === 'user' ? 'msg-user' : 'msg-ai');
      div.innerHTML = `<strong>${role === 'user' ? '👤 Siz:' : '🤖 AI:'}</strong> ${text}`;
      transcriptBox.appendChild(div);
      transcriptBox.scrollTop = transcriptBox.scrollHeight;
    }

    function resetUI(statusMsg, statusCls) {
      callActive = false;
      stopTimer();
      callBtn.disabled = false;
      callBtn.classList.remove('active');
      callIcon.textContent = '🎙️';
      callText.textContent = 'Boshlash';
      setStatus(statusMsg || 'Tugmani bosing va mikrofonga ruxsat bering', statusCls || '');
    }

    function setupVapiEvents(instance) {
      instance.on('call-start', () => {
        callActive = true;
        startTimer();
        callBtn.disabled = false;
        callBtn.classList.add('active');
        callIcon.textContent = '🔴';
        callText.textContent = 'Tugatish';
        setStatus('🟢 Jonli muloqot — AI sizni tinglamoqda', 'active');
      });

      instance.on('speech-start', () => setStatus('🎤 Siz gapiryapsiz...', 'speaking'));
      instance.on('speech-end', () => setStatus('🤖 AI javob bermoqda...', 'active'));

      instance.on('message', (msg) => {
        if (msg.type === 'transcript' && msg.transcriptType === 'final') {
          appendTranscript(msg.role === 'user' ? 'user' : 'ai', msg.transcript);
        }
      });

      instance.on('call-end', () => {
        resetUI('⚪ Qo‘ng‘iroq yakunlandi. Yana gaplashish uchun bosing.', '');
      });

      instance.on('error', (err) => {
        console.error('Vapi error:', err);
        const detail = err?.error?.message || err?.message || (typeof err === 'string' ? err : '');
        resetUI(detail ? `⚠️ ${detail}` : 'Xatolik yuz berdi. Qaytadan urinib ko‘ring.', 'error');
      });
    }

    async function loadVapi() {
      if (vapi) return vapi;

      // 1. html-script-tag orqali vapiSDK
      if (window.vapiSDK && typeof window.vapiSDK.run === 'function') {
        try {
          const inst = window.vapiSDK.run({
            apiKey: PUBLIC_KEY,
            assistant: ASSISTANT_ID
          });
          if (inst) {
            vapi = inst;
            setupVapiEvents(vapi);
            return vapi;
          }
        } catch (e) {
          console.warn('vapiSDK run error:', e);
        }
      }

      // 2. ESM import fallback
      try {
        const mod = await import('https://cdn.jsdelivr.net/npm/@vapi-ai/web@3/+esm');
        const VapiClass = mod.default?.default || mod.default || mod.Vapi || mod;
        vapi = new VapiClass(PUBLIC_KEY);
        setupVapiEvents(vapi);
        return vapi;
      } catch (e1) {
        const mod2 = await import('https://esm.sh/@vapi-ai/web@3.1.1');
        const VapiClass2 = mod2.default?.default || mod2.default || mod2.Vapi || mod2;
        vapi = new VapiClass2(PUBLIC_KEY);
        setupVapiEvents(vapi);
        return vapi;
      }
    }

    async function toggleCall() {
      if (callActive) {
        if (vapi) {
          try { vapi.stop(); } catch (e) {}
        }
        resetUI('Qo‘ng‘iroq to‘xtatildi.', '');
        return;
      }

      // Qo'ng'iroqni boshlash
      setStatus('⏳ Ulanmoqda... Mikrofonga ruxsat bering', '');
      callBtn.disabled = true;

      try {
        const inst = await loadVapi();
        await inst.start(ASSISTANT_ID);
      } catch (err) {
        console.error('Start error:', err);
        callBtn.disabled = false;
        const msg = err?.message || '';
        const isMic = msg.includes('Permission') || msg.includes('NotAllowed') || msg.includes('getUserMedia');
        resetUI(
          isMic
            ? '⚠️ Mikrofonga ruxsat berilmadi. Brauzerda ruxsat bering.'
            : (msg ? `⚠️ Ulanib bo‘lmadi: ${msg}` : 'Ulanib bo‘lmadi.'),
          'error'
        );
      }
    }

    callBtn.addEventListener('click', toggleCall);

    // Kesh qoldiqlarini tozalash
    try {
      localStorage.removeItem('vapi_assistant_id');
      localStorage.removeItem('vapi_public_key');
    } catch (e) {}
  </script>

</body>

</html>
